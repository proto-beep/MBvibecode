# [Z-GST] Global statistics of MB x Vibecode: Credits Importer from MusicBrainz's edit dump.
# Reads mbdump-edit.tar.bz2 of the latest full export (MetaBrainz, twice a week) as a stream and commits
# stats/mb-vibecode-credits-importer-global.json to the data branch "stats" (made on the first run); the script's
# statistics show it ("Global"). Only numbers, see stats/README.md.
name: Global statistics

on:
  workflow_dispatch:
    inputs:
      core:
        description: 'Also read the core dump mbdump.tar.bz2 (artists, releases, recordings – normally only on Sundays)'
        type: boolean
        default: false
  # (Thursday and Sunday, after the dumps of Wednesday and Saturday)
  schedule:
    - cron: '17 5 * * 0,4'
  # (a change of the script or of this file on the default branch: once)
  push:
    branches: [main]
    paths:
      - 'stats/global_stats.py'
      - '.github/workflows/global-stats.yml'

permissions:
  contents: write

concurrency:
  group: global-stats
  cancel-in-progress: false

defaults:
  run:
    # (bash -eo pipefail: a failed download or decompression fails the step)
    shell: bash

env:
  BASE: https://data.metabrainz.org/pub/musicbrainz/data/fullexport
  DATA_BRANCH: stats
  OUT: stats/mb-vibecode-credits-importer-global.json

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q lbzip2
      - name: Self-test
        run: python3 stats/test_global_stats.py
      - name: The latest dump
        id: dump
        run: |
          DUMP=$(curl -fsSL --retry 3 "$BASE/LATEST" | tr -d '[:space:]')
          [[ "$DUMP" =~ ^[0-9]{8}-[0-9]{6}$ ]] || { echo "unexpected LATEST: $DUMP"; exit 1; }
          echo "dump=$DUMP" >> "$GITHUB_OUTPUT"
          OLD=''
          echo '{}' > "$RUNNER_TEMP/old.json"
          if git fetch -q --depth 1 origin "$DATA_BRANCH" 2>/dev/null; then
            OLD=$(git show "FETCH_HEAD:$OUT" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('dump',''))" 2>/dev/null || true)
            # [3.55.0] the result of before (its section "core" is kept when the core dump is not read)
            git show "FETCH_HEAD:$OUT" > "$RUNNER_TEMP/old.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/old.json"
          elif git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            # ((3.55.0, review) the data branch is there but could not be read: not run on without it)
            echo "the branch $DATA_BRANCH could not be fetched"; exit 1
          fi
          # (a scheduled run with nothing new does nothing)
          if [ "${{ github.event_name }}" = schedule ] && [ "$OLD" = "$DUMP" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          echo "dump: $DUMP (last: ${OLD:-none})"
          # [3.55.0, Z-AGS] the core dump once a week (Sundays) or when asked – ((review) and when the section "core" of before is missing
          # or 6 days or more older than this dump); else it is kept
          STALE=$(DUMP="$DUMP" python3 -c "
          import datetime as d, json, os, sys
          c = (json.load(open(sys.argv[1])) or {}).get('core') or {}
          f = lambda x: d.datetime.strptime(x[:8], '%Y%m%d')
          try: print(1 if (f(os.environ['DUMP']) - f(c.get('dump') or '')).days >= 6 else 0)
          except ValueError: print(1)" "$RUNNER_TEMP/old.json" 2>/dev/null || echo 1)
          if [ "$(date -u +%u)" = 7 ] || [ "${{ inputs.core }}" = true ] || [ "$STALE" = 1 ]; then echo "core=1" >> "$GITHUB_OUTPUT"; fi
      - name: Read the edit dump
        if: steps.dump.outputs.skip != '1'
        env:
          DUMP: ${{ steps.dump.outputs.dump }}
        run: |
          curl -fsSL --retry 3 "$BASE/$DUMP/mbdump-edit.tar.bz2" | lbzip2 -dc | python3 stats/global_stats.py --dump "$DUMP" --out "$RUNNER_TEMP/global.json" \
            --facts "$RUNNER_TEMP/facts.json" --keep-core "$RUNNER_TEMP/old.json"
      # [3.55.0, Z-AGS] the artists, releases and recordings of the script's edits, from the core dump (only numbers go into the result)
      - name: Read the core dump
        id: core
        if: steps.dump.outputs.skip != '1' && steps.dump.outputs.core == '1'
        # (a failed core pass keeps the section "core" of before: the edit pass's result is committed all the same – (review) within its own
        # time, so that the job's time is not used up)
        continue-on-error: true
        timeout-minutes: 150
        env:
          DUMP: ${{ steps.dump.outputs.dump }}
        run: |
          curl -fsSL --retry 3 "$BASE/$DUMP/mbdump.tar.bz2" | lbzip2 -dc | python3 stats/global_stats.py --core --facts "$RUNNER_TEMP/facts.json" --merge "$RUNNER_TEMP/global.json" --dump "$DUMP"
      - name: The core dump failed
        if: steps.core.outcome == 'failure'
        run: echo "::warning::The core dump could not be read – the section \"core\" of before is kept"
      - name: Commit the result to the data branch
        if: steps.dump.outputs.skip != '1'
        env:
          DUMP: ${{ steps.dump.outputs.dump }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for try in 1 2; do
            if git fetch -q origin "$DATA_BRANCH" 2>/dev/null; then
              git checkout -q -B "$DATA_BRANCH" FETCH_HEAD
            else
              # (the first run: a branch of its own, with only the result)
              # ((review) a name of its own for each try – a second try finds no branch in its way)
              git checkout -q --orphan "tmp-stats-$try"
              git rm -rq --cached . && git clean -fdqx -e .git
              printf '# Global statistics\n\nData of the workflow "Global statistics" on main (see stats/README.md there). Only numbers.\n' > README.md
              git add README.md
            fi
            mkdir -p stats
            cp "$RUNNER_TEMP/global.json" "$OUT"
            git add "$OUT"
            git diff --cached --quiet && exit 0
            git commit -q -m "Global statistics: dump $DUMP"
            git push -q origin "HEAD:$DATA_BRANCH" && exit 0
            sleep 10
          done
          exit 1
